<style>

<script type="module">

//
// LIVE LIFE: between his daily AI runs, Odyssey Jr. lives on his own in the browser. His needs

// The sim is replayed from midnight with a seed based on the date, so every visitor sees the same chicken.

  scene.background.copy(nightSky).lerp(daySky, k); scene.fog.color.copy(scene.background);

  sun.color.set(k < 1 ? 0xffc39a : 0xfff0d8);

// ---------- art style: cozy filter ----------
// world.json "style": { vignette 0..1 (soft dark edges), warmth -1..1 (cool to warm), saturation 0..2, brightness 0.5..1.5 }.
// Set any of them to change the mood of the whole world. You can also write a brand-new filter shader here.
const style = world.style ?? {};
const composer = new EffectComposer(renderer);

const cozy = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, vignette: { value: style.vignette ?? 0.35 }, warmth: { value: style.warmth ?? 0.15 },

  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `

    varying vec2 vUv;
    void main(){

const texCache = {};
function makeTex(kind) {

  const noise = (n, a, col) => { for (let i = 0; i < n; i++) { g.fillStyle = col(Math.random()); g.globalAlpha = a * Math.random(); g.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 3, 2 + Math.random() * 3); } g.globalAlpha = 1; };

    if (kind === "planks") { g.fillStyle = "rgba(40,22,10,.6)"; for (let y = 0; y < 256; y += 42) { g.fillRect(0, y, 256, 3); g.fillRect(((y / 42) % 2) * 128 + 60, y, 3, 42); } }
  } else if (kind === "stone") {
    g.fillStyle = "#8f8a84"; g.fillRect(0, 0, 256, 256);
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { g.fillStyle = `hsl(30,${4 + Math.random() * 6}%,${50 + Math.random() * 14}%)`; g.fillRect(x * 64 + 2, y * 64 + 2, 60, 60); }

  } else if (kind === "grass" || kind === "dirt") {
    g.fillStyle = kind === "grass" ? "#7fbf5f" : "#b48a58"; g.fillRect(0, 0, 256, 256);
    noise(5000, 0.35, r => kind === "grass" ? (r > 0.5 ? "#5e9e45" : "#a6d97c") : (r > 0.5 ? "#8d6a40" : "#d4b07c"));

  pine: o => fromParts([
    { shape: "cylinder", size: [0.22, 0.3, 1.1], pos: [0, 0.55, 0], color: "#c49a6c", texture: "wood" },
    { shape: "cone", size: [1.5, 2.2], pos: [0, 2.0, 0], color: o.color ?? "#2f7a46" },

  flower: o => fromParts([
    { shape: "cylinder", size: [0.035, 0.035, 0.6], pos: [0, 0.3, 0], color: "#3c8a2e" },

    { shape: "sphere", size: [0.07], pos: [0, 0.7, 0.12], color: "#ffe066" }]),

function chooseAction(n, hour, rnd) {
  if (isNightHour(hour)) return "sleep";
  const lack = k => (100 - n[k]) / 100;
  const scores = {
    eat: lack("fullness") ** 2 * 6, drink: lack("fullness") * 0.8 + lack("calm") * 0.6,
    forage: lack("fullness") * 1.2 + 0.3, nap: lack("energy") ** 2 * 5,
    explore: lack("wonder") * 2 + 0.2, work: 1.2 + lack("wonder"), admire: builtObjects.length ? lack("mood") * 1.5 + 0.2 : 0,
    dustbath: lack("calm") ** 2 * 4, think: lack("calm") + lack("wonder") * 0.5, dance: n.mood > 75 ? 0.6 : 0.1
  };
  let total = 0; for (const k in scores) total += scores[k];
  let r = rnd() * total;
  for (const k in scores) { r -= scores[k]; if (r <= 0) return k; }
  return "explore";
}
function placeFor(name, rnd, here) {
  const a = ACTIONS[name];
  if (a.where === "*focus") return spotPos(state.spot);
  if (a.where === "*built" && builtObjects.length) { const b = builtObjects[Math.floor(rnd() * builtObjects.length)]; sim.target = b.name; return [b.pos[0] + 1.6, b.pos[1] + 1.6]; }

  if (a.where === "*here") return here;
  return spotPos(a.where);
}

  n.mood = clamp(n.mood + (avg - n.mood) * 0.03 + (fx.mood ?? 0));
}

}

    let dRot = Math.atan2(v.x, v.z) - chicken.rotation.y; dRot = Math.atan2(Math.sin(dRot), Math.cos(dRot)); chicken.rotation.y += dRot * Math.min(1, dt * 8);
    legs[0].rotation.x = Math.sin(step) * 0.75; legs[1].rotation.x = -Math.sin(step) * 0.75;
    legs[0].position.y = 0.44 + Math.max(0, Math.sin(step)) * 0.06; legs[1].position.y = 0.44 + Math.max(0, -Math.sin(step)) * 0.06;
    body.rotation.z = Math.sin(step) * 0.13; body.rotation.x = 0.08;
    const bounce = Math.abs(Math.sin(step)) * 0.07; body.position.y = 0.78 + bounce;
    const s = (step / Math.PI) % 1, thrust = s < 0.55 ? s / 0.55 : 1 - (s - 0.55) / 0.45;
    head.position.z = 0.42 + thrust * 0.18; head.position.y = 1.42 + bounce * 0.6; neck.position.z = 0.4 + thrust * 0.08; neck.position.y = 1.18 + bounce * 0.6;
    tail.rotation.y = Math.sin(step) * 0.3;
    if (run) wings.forEach((w, i) => w.rotation.z = (0.4 + Math.sin(t * 30) * 0.3) * (i ? -1 : 1));
  } else {
    moving = false;
    if (anim === "sleep") { body.position.y = 0.6 + Math.sin(t * 1.5) * 0.02; head.position.set(0, 1.18, 0.45); neck.position.y = 1.0; head.rotation.x = 0.55; eyes.forEach(e => e.scale.y = 0.1); legs.forEach(l => l.position.y = 0.3); }
    else if (anim === "peck") { const p = Math.max(0, Math.sin(t * 7)); head.rotation.x = p * 0.9; head.position.y = 1.42 - p * 0.35; head.position.z = 0.5 + p * 0.15; body.rotation.x = p * 0.25; tail.rotation.x = -p * 0.2; }
    else if (anim === "scratch") { const ph = t % 1.6; if (ph < 0.8) { legs[Math.floor(t / 1.6) % 2].rotation.x = -Math.abs(Math.sin(ph / 0.8 * Math.PI * 2)) * 0.9; body.rotation.x = 0.15; } else { const p = Math.sin((ph - 0.8) / 0.8 * Math.PI); head.rotation.x = p * 0.9; head.position.y = 1.42 - p * 0.35; body.rotation.x = p * 0.25; } }
    else if (anim === "build") { head.rotation.x = Math.abs(Math.sin(t * 10)) * 0.5; chicken.position.y = Math.abs(Math.sin(t * 5)) * 0.1; wings.forEach((w, i) => w.rotation.z = Math.sin(t * 10) * 0.3 * (i ? -1 : 1)); }
    else if (anim === "dance") { chicken.rotation.y += dt * 3; chicken.position.y = Math.abs(Math.sin(t * 6)) * 0.25; body.rotation.z = Math.sin(t * 6) * 0.2; wings.forEach((w, i) => w.rotation.z = (0.5 + Math.sin(t * 14) * 0.5) * (i ? -1 : 1)); tail.rotation.y = Math.sin(t * 12) * 0.5; }
    else if (anim === "dust") { body.position.y = 0.55; body.rotation.z = Math.sin(t * 4) * 0.35; wings.forEach((w, i) => w.rotation.z = (0.6 + Math.sin(t * 16) * 0.3) * (i ? -1 : 1)); head.position.y = 1.2; legs.forEach(l => l.position.y = 0.3); }
    else if (anim === "think") { head.rotation.z = Math.sin(t * 0.8) * 0.22; head.rotation.x = -0.18; body.position.y = 0.66; legs.forEach(l => l.position.y = 0.34); }
    else if (anim === "explore") { head.rotation.y = Math.sin(t * 1.5) * 0.7; if ((t % 6) < dt) { const lim = size / 2 - 2; goTo([THREE.MathUtils.clamp(chicken.position.x + (Math.random() - 0.5) * 6, -lim, lim), THREE.MathUtils.clamp(chicken.position.z + (Math.random() - 0.5) * 6, -lim, lim)]); } }
    else { head.rotation.y = Math.sin(t * 2) * 0.6; }
    if (anim !== "sleep") { // idle life: curious head tilts, a wing ruffle, small wanders around the spot
      idleTimer -= dt; if (idleTimer < 0) { idleTimer = 2 + Math.random() * 4; lookTilt = (Math.random() - 0.5) * 0.7; }
      head.rotation.z += lookTilt;
      if ((t % 11) < 0.35) wings.forEach((w, i) => w.rotation.z += Math.sin(t * 40) * 0.25 * (i ? -1 : 1));
      if (anim !== "explore" && anim !== "dance" && anim !== "dust" && (t % 9) < dt && !override) goTo([sim.place[0] + (Math.random() - 0.5) * 1.5, sim.place[1] + (Math.random() - 0.5) * 1.5]);
    }
  }
  if (hop > 0) { hop = Math.max(0, hop - dt * 2.2); chicken.position.y += Math.sin(hop * Math.PI) * 0.45; wings.forEach((w, i) => w.rotation.z = (0.8 * hop) * (i ? -1 : 1)); }
  if (override?.act === "eat" && seeds.children.length && Math.random() < dt * 2.5) seeds.remove(seeds.children[0]);

  bubbleTimer -= dt;
  if (bubbleTimer <= 0) { const opts = lines[sim.act] ?? ["Bawk."]; say(Math.random() < 0.3 ? (state.thought ?? opts[0]) : opts[Math.floor(Math.random() * opts.length)], 6); }
  bubble.textContent = bubbleText;

  if (follow) controls.target.lerp(camGoal.set(chicken.position.x, 1, chicken.position.z), 0.03);
  controls.update();
  composer.render();

  const p = new THREE.Vector3(chicken.position.x, 2.6, chicken.position.z).project(camera);
  bubble.style.left = (p.x * 0.5 + 0.5) * innerWidth + "px";
  bubble.style.top = (-p.y * 0.5 + 0.5) * innerHeight + "px";
  bubble.style.opacity = p.z < 1 ? 1 : 0;
  for (const l of labels) {
    const q = l.pos.clone().project(camera);
    l.el.style.left = (q.x * 0.5 + 0.5) * innerWidth + "px";
    l.el.style.top = (-q.y * 0.5 + 0.5) * innerHeight + "px";
    l.el.style.display = q.z < 1 ? "block" : "none";
  }
  for (const b of behaviors) { try { b.update?.(dt, t); } catch (e) { console.warn("behavior error", e); b.update = null; } }
  mmTimer -= dt; if (mmTimer <= 0) { mmTimer = 0.25; drawMinimap(); }
  requestAnimationFrame(animate);
}
// ---------- object behaviors ----------
// An object in world.json can have "script": "behaviors/name.js". That module exports a default function
// setup(ctx) that returns { update(dt, t), onClick() } (both optional). ctx has THREE, obj (the object's 3D group),
// scene, say(text, secs), chicken, sim, world, state, part (shape builder) and texFor (textures).
for (const { o, obj } of behaviorQueue) {
  import("./" + o.script + bust).then(m => {
    const api = m.default?.({ THREE, obj, data: o, scene, say, chicken, sim, world, state, part, texFor });
    if (api) behaviors.push({ ...api, obj });
  }).catch(e => console.warn("behavior failed to load", o.script, e));
}
goTo(sim.place); updateSky(new Date()); renderUI(); animate();

// ---------- diary ----------
function md(src) {
  if (!src) return "<p class='intro'>Nothing here yet.</p>";
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/\[\[(.+?)\]\]/g, "<b>$1</b>").replace(/\[(.+?)\]\((.+?)\)/g, (m, a, b) => /^(https?:|[\w./-]+$)/.test(b) ? `<a href="${b}" target="_blank" rel="noopener">${a}</a>` : a);
  let out = "", inList = false;
  for (const raw of src.split("\n")) {
    const line = raw.trimEnd(); const li = line.match(/^\s*[-*] (.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const h = line.match(/^(#{1,3}) (.*)/);
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}
function ago(d) {
  const s = (Date.now() - new Date(d).getTime()) / 1000; if (isNaN(s)) return "";
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago";
}
const KIND = { internet: "🌐 Internet", made: "🛠️ Made", thought: "💭 Thought", moment: "📍 Moment" };
const cap = s => s[0].toUpperCase() + s.slice(1);
const TABS = [
  { id: "stories", name: "stories", load: async () => {
      const idx = await tryJSON("brain/journal/index.json", { entries: [] });
      return `<p class="intro">Every day is a story. Tap one to read it.</p>` + (idx.entries ?? []).map(e => `<div class="entry story" data-file="${esc(e.file)}"><div class="top"><b>${esc(e.title)}</b><span class="ago">${esc(e.date)}</span></div></div>`).join("");
  } },
  { id: "day", name: "his day", load: async () => {
      const log = await tryJSON("brain/log.json", { entries: [] });
      const ai = [...(log.entries ?? [])].reverse().slice(0, 25).map(e => `<div class="entry"><div class="top">${esc(KIND[e.kind] ?? e.kind)}${e.title ? ` · ${esc(e.title)}` : ""}<span class="ago">${ago(e.time)}</span></div>${e.query ? `<div class="meta">looked up "${esc(e.query)}"${e.source ? ` · reading: ${esc(e.source)}` : ""}</div>` : ""}<div>${esc(e.text)}</div>${e.story ? `<div class="meta"><u>part of a longer story: ${esc(e.story)}</u></div>` : ""}</div>`).join("");
      const yard = [...sim.history].reverse().slice(0, 8).map(h => `<div class="entry"><div class="top">${ACTIONS[h.act].icon} In the yard<span class="ago">${ago(h.at)}</span></div><div>${esc(cap(ACTIONS[h.act].doing))}${h.target ? ` (the ${esc(h.target)})` : ""}.</div></div>`).join("");
      return `<p class="intro"><b>Today's focus:</b> ${esc(state.today ?? "")}</p>${ai}<h3>Earlier today in the yard</h3>${yard || "<p class='intro'>Still waking up.</p>"}`;
  } },
  { id: "wants", name: "he wants", load: async () => {
      const [w, rq] = await Promise.all([tryJSON("brain/wants.json", { wants: [] }), tryJSON("brain/requests.json", { requests: [] })]);
      reqCache = rq.requests ?? [];
      const reqs = reqCache.map((r, i) => `<div class="want"><b>🛠️ ${esc(r.item)}</b><span>${esc(r.why)}</span>${r.status === "delivered" ? "" : `<span style="padding:0;margin-top:6px"><button class="copyReq paper pill" data-i="${i}" style="padding:4px 10px;font-weight:800;font-size:12px;cursor:pointer;border-width:1.5px">📋 Copy request</button></span>`}<span class="tag ${r.status === "delivered" ? "done" : ""}">${r.status === "delivered" ? "delivered" : "waiting"}</span></div>`).join("");
      return `<p class="intro">He asks for things he needs. Every one of these points at something that actually happened to him.</p>` + (w.wants ?? []).map(x => `<div class="want"><b>${esc(x.item)}</b><span>${esc(x.reason)}</span><span class="tag ${(x.status ?? "waiting") === "waiting" ? "" : "done"}">${esc(x.status ?? "waiting")}</span></div>`).join("")
        + (reqs ? `<h3>Model requests for OdysseyChicken</h3><p class="intro">Things he wants built in Blender. Copy one and paste it into a chat in the Odyssey Jr. project.</p>${reqs}` : "");
  } },
  { id: "visitors", name: "visitors", load: async () => md(await getText("brain/visitors.md")) },
  { id: "about", name: "about", load: async () => md(await getText("brain/personality.md")) + `<h2>Things I've made</h2><ul>${[...(projects.making ?? []), ...(projects.done ?? [])].map(i => `<li>${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : esc(i.title)}${i.note ? ` · ${esc(i.note)}` : ""}</li>`).join("") || "<li>Nothing yet</li>"}</ul>` }
];
$("tabs").innerHTML = TABS.map(tb => `<button data-tab="${tb.id}">${tb.name}</button>`).join("");
async function openTab(id) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
  $("tabBody").innerHTML = "Loading…";
  $("tabBody").innerHTML = await TABS.find(tb => tb.id === id).load();
}
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) openTab(b.dataset.tab); };
let reqCache = [];
function requestText(r) {
  const p = r.place ?? {};
  return [`🛠️ ODYSSEY JR. MODEL REQUEST (id: ${r.id})`, ``,
    `Item: ${r.item}`, `Why he wants it: ${r.why}`, `What it looks like: ${r.description}`,
    `Size: ${r.size ?? "chicken-sized scale (Odyssey Jr. is about 2 units tall)"}`,
    `Colors / materials: ${r.materials ?? "builder's choice, cozy storybook style"}`,
    `Place it at: x ${p.pos?.[0] ?? 0}, z ${p.pos?.[1] ?? 0}, rotation ${p.rot ?? 0}${p.near ? ` (near ${p.near})` : ""}`,
    `Label: ${r.label ?? "none"}`,
    `What it should do: ${r.interactive ?? "nothing, it's just decoration"}`, ``,
    `Follow the "Building Odyssey Jr.'s model requests" guide in this project.`].join("\n");
}
$("tabBody").onclick = async e => {
  const cb = e.target.closest(".copyReq");
  if (cb) { const txt = requestText(reqCache[+cb.dataset.i]); try { await navigator.clipboard.writeText(txt); cb.textContent = "✅ Copied!"; } catch { prompt("Copy this request:", txt); } return; }
  if (e.target.id === "backToStories") { e.preventDefault(); openTab("stories"); return; }
  const s = e.target.closest(".story"); if (s) $("tabBody").innerHTML = `<p><a href="#" id="backToStories">← all stories</a></p>` + md(await getText(s.dataset.file));
};
$("diaryBtn").onclick = () => { $("diary").classList.add("open"); $("diaryBtn").style.display = "none"; openTab("day"); };
$("closeDiary").onclick = () => { $("diary").classList.remove("open"); $("diaryBtn").style.display = ""; };
</script>
