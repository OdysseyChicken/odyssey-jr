<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root { --ink:#2b2540; --paper:#f6f1e3; --accent:#3b2fa0; --muted:#7c7392; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:"Nunito", ui-rounded, system-ui, sans-serif; color:var(--ink); background:#2a2470; }
  #scene { position:fixed; inset:0; }
  .paper { z-index:10; background:var(--paper); border:2px solid var(--ink); border-radius:20px; box-shadow:0 6px 0 rgba(43,37,64,.25), 0 10px 30px rgba(0,0,0,.25); }
  .pill { border-radius:999px; }
  button { font-family:inherit; color:inherit; }

  #stats { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:8px 10px; }
  .stat { padding:2px 12px; min-width:104px; border-right:1.5px dashed #cfc4a8; }
  .stat:last-child { border-right:0; }
  .stat .lbl { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
  .stat .dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--ink); }
  .bar { margin-top:4px; height:8px; background:#e2d9c2; border:1.5px solid var(--ink); border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; transition:width .8s ease; }

  #diaryBtn { position:fixed; top:12px; left:12px; padding:10px 14px; font-weight:800; font-size:14px; cursor:pointer; }
  #diary { position:fixed; top:12px; left:12px; width:min(420px, calc(100vw - 24px)); max-height:calc(100vh - 110px); display:none; flex-direction:column; overflow:hidden; }
  #diary.open { display:flex; }
  #diary header { display:flex; align-items:center; gap:8px; padding:12px 14px 6px; font-weight:800; }
  #diary header small { color:var(--muted); font-weight:700; }
  #diary header button { margin-left:auto; width:30px; height:30px; border:2px solid var(--ink); border-radius:50%; background:transparent; font-weight:800; cursor:pointer; }
  #tabs { display:flex; gap:2px; padding:6px 10px 8px; border-bottom:1.5px dashed #cfc4a8; flex-wrap:wrap; }
  #tabs button { border:0; background:transparent; padding:5px 12px; border-radius:999px; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--muted); }
  #tabs button.on { background:var(--accent); color:#fff; }
  #tabBody { padding:12px 16px 16px; overflow:auto; font-size:14px; line-height:1.5; }
  #tabBody h1 { font-size:18px; margin:2px 0 8px; } #tabBody h2 { font-size:15.5px; margin:12px 0 6px; } #tabBody h3 { font-size:14.5px; margin:10px 0 4px; }
  #tabBody ul { padding-left:18px; margin:4px 0; } #tabBody p { margin:6px 0; }
  #tabBody a { color:var(--accent); }
  .intro { color:var(--muted); margin:0 0 10px; }
  .entry { padding:10px 0; border-bottom:1.5px solid #e2d9c2; }
  .entry:last-child { border-bottom:0; }
  .entry .top { display:flex; align-items:center; gap:8px; font-weight:800; }
  .entry .ago { margin-left:auto; color:var(--muted); font-size:12px; font-weight:700; white-space:nowrap; }
  .entry .meta { color:var(--muted); font-size:12.5px; margin:2px 0; }
  .tag { display:inline-block; border:1.5px solid var(--ink); border-radius:999px; padding:0 8px; font-size:11.5px; font-weight:800; }
  .want { border:2px solid var(--ink); border-radius:16px; padding:10px 12px; margin:10px 0; position:relative; background:#fbf8ef; }
  .want b { display:block; font-size:15px; padding-right:80px; } .want .why { color:#4d4566; font-size:13px; display:block; padding-right:80px; }
  .want .tag { position:absolute; right:10px; top:12px; background:var(--paper); color:var(--ink); }
  .want .tag.done { background:#c8f0b8; }
  .story { cursor:pointer; } .story:hover b { text-decoration:underline; }

  #action { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:6px 18px 6px 6px; max-width:calc(100vw - 340px); min-width:280px; font-size:14.5px; }
  #avatar { width:34px; height:34px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; background:#fff; font-size:18px; flex:none; }
  #actionText { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #actionSince { color:var(--muted); font-size:12px; font-weight:700; margin-left:auto; white-space:nowrap; }

  #tools { position:fixed; right:12px; bottom:16px; display:flex; gap:6px; z-index:10; flex-wrap:wrap; justify-content:flex-end; max-width:calc(50vw - 150px); }
  #tools button { padding:9px 13px; font-size:13px; font-weight:800; cursor:pointer; }
  #minimap { position:fixed; left:14px; bottom:14px; width:130px; height:130px; border-radius:50%; overflow:hidden; padding:0; }
  #minimap canvas { width:100%; height:100%; display:block; }
  #modal { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(720px, calc(100vw - 24px)); max-height:calc(100vh - 120px); display:none; flex-direction:column; overflow:hidden; z-index:15; }
  #modal.open { display:flex; }
  #modal header { display:flex; align-items:flex-start; gap:8px; padding:14px 18px 10px; border-bottom:1.5px dashed #cfc4a8; }
  #modal header b { font-size:19px; display:block; } #modal header span { color:var(--muted); font-size:13.5px; }
  #modal header button { margin-left:auto; width:30px; height:30px; border:2px solid var(--ink); border-radius:50%; background:transparent; font-weight:800; cursor:pointer; flex:none; }
  #modalBody { padding:14px 18px 18px; overflow:auto; font-size:14px; }
  .slots { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; max-width:300px; }
  .slot { aspect-ratio:1; border:2px solid var(--ink); border-radius:14px; background:#fbf8ef; display:grid; place-items:center; font-size:38px; cursor:pointer; position:relative; padding:0; }
  .slot.empty { border-style:dashed; border-color:#cfc4a8; cursor:default; } .slot.on { box-shadow:0 0 0 3px #f5a742; }
  .slot.small { width:54px; font-size:26px; border-radius:12px; } .slot .new { position:absolute; top:-7px; right:-7px; font-size:10px; font-weight:800; background:#c8f0b8; border:1.5px solid var(--ink); border-radius:99px; padding:0 5px; }
  .bagCols { display:grid; grid-template-columns:minmax(0, 300px) 1fr; gap:18px; } @media (max-width:640px) { .bagCols { grid-template-columns:1fr; } }
  .detail { border:2px solid var(--ink); border-radius:16px; padding:10px 12px; margin-top:10px; background:#fbf8ef; min-height:74px; }
  .detail b { font-size:15.5px; display:block; } .detail span { color:#4d4566; font-size:13px; display:block; }
  .shelfRow { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 12px; } .secLabel { color:var(--muted); font-weight:800; font-size:12.5px; }
  .outfit { border:2px solid var(--ink); border-radius:16px; padding:10px 12px; margin:10px 0; background:#fbf8ef; display:flex; gap:12px; align-items:center; }
  .outfit .ico { font-size:34px; } .outfit b { font-size:15.5px; } .outfit p { margin:2px 0 0; color:#4d4566; font-size:13px; }
  .outfit .side { margin-left:auto; display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex:none; }
  .btn { padding:5px 11px; font-weight:800; font-size:12.5px; cursor:pointer; border-width:1.5px; box-shadow:0 3px 0 rgba(43,37,64,.25); }

  #bubble { position:fixed; z-index:5; transform:translate(-50%,-100%); background:var(--paper); border:2px solid var(--ink); border-radius:16px; padding:6px 12px; font-size:13.5px; font-weight:700; max-width:240px; pointer-events:none; transition:opacity .4s; }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%) rotate(45deg); width:12px; height:12px; background:var(--paper); border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); }
  .label3d { position:fixed; transform:translate(-50%,-100%); font-size:11.5px; font-weight:800; background:var(--paper); border:1.5px solid var(--ink); padding:1px 8px; border-radius:999px; pointer-events:none; white-space:nowrap; }
  #err { position:fixed; z-index:20; top:80px; left:12px; right:12px; background:#ffdede; border:2px solid #a33; border-radius:12px; padding:10px; font-size:13px; display:none; }
  @media (max-width:1150px) { #tools { flex-direction:column; align-items:flex-end; } }
  @media (max-width:800px) {
    #stats { top:auto; bottom:70px; left:8px; right:8px; transform:none; overflow-x:auto; }
    .stat { min-width:84px; padding:2px 8px; } .stat .lbl { font-size:12px; }
    #action { left:8px; right:8px; transform:none; max-width:none; min-width:0; bottom:12px; }
    #minimap { display:none; } #tools { top:12px; bottom:auto; max-width:calc(100vw - 190px); flex-direction:row; }
  }
</style>

<div id="stats" class="paper pill"></div>
<button id="diaryBtn" class="paper pill">📓 Odyssey's diary</button>
<div id="diary" class="paper">
  <header>📓 Odyssey's diary <small id="dayTag"></small><button id="closeDiary" title="Close">✕</button></header>
  <div id="tabs"></div>

</div>

<script type="module">
// ODYSSEY-JR-ENGINE v3
// Data files: world/world.json (objects, spots, style), world/state.json (today's focus), world/character.json (look),
// world/projects.json, brain/log.json (his day), brain/wants.json (he wants), brain/journal/index.json (stories),
// brain/visitors.md, brain/personality.md. Prefer editing data. Edit this engine to add new abilities.
//
// LIVE LIFE: between his daily AI runs, Odyssey Jr. lives on his own in the browser. His needs
// (fullness, energy, wonder, mood, calm) drift over time and he picks actions to meet them.
// The sim is replayed from midnight with a seed based on the date, so every visitor sees the same chicken.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { findsFor } from "./world/finds.js";
import { weatherAt, weatherFor, KINDS as WEATHER_KINDS, compass } from "./world/weather.js";
import { meteorRates } from "./world/meteors.js";
import { frostAt } from "./world/frost.js";
import { ovenAt } from "./world/bake.js";
import { kiteAt } from "./world/kite.js";
import { inService } from "./world/rail.js";
import { balloonAt } from "./world/balloon.js";
import { beesAt } from "./world/bees.js";
import { turkeysAt } from "./world/turkeys.js";
import { millAt } from "./world/mill.js";
import { daylight as skyDaylight, sunAlt as sunAltNow, sunPos as sunPosNow, moonPos as moonPosNow, altAz as skyAltAz, toYard as skyToYard } from "./world/sky.js";

const $ = id => document.getElementById(id);
const showError = msg => { const e = $("err"); e.style.display = "block"; e.textContent = "Something broke: " + msg; };
window.addEventListener("error", e => showError(e.message));

const bust = "?v=" + Date.now();
const getJSON = async p => { const r = await fetch(p + bust); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); };
const tryJSON = async (p, d) => { try { return await getJSON(p); } catch { return d; } };
const getText = async p => { try { const r = await fetch(p + bust); return r.ok ? await r.text() : null; } catch { return null; } };
function rngFor(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }

let world, state, projects, character, wardrobe, bagData;
try {
  [world, state, projects, character, wardrobe, bagData] = await Promise.all([
    getJSON("world/world.json"), getJSON("world/state.json"),
    tryJSON("world/projects.json", { making: [], done: [] }),
    tryJSON("world/character.json", { colors: {}, outfit: {} }),
    tryJSON("world/wardrobe.json", null), tryJSON("brain/bag.json", { slots: 9, bag: [], shelves: {}, findables: [] })
  ]);
} catch (e) { showError(e.message); throw e; }

// ---------- renderer, camera, light ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 300);
camera.position.set(12, 9, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
$("scene").appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.userData.focus = controls.target; // weather (rain) follows what you look at
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.48; controls.minDistance = 3; controls.maxDistance = 72;

const hemi = new THREE.HemisphereLight(0xfff6e8, 0x5a6b4a, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2);
sun.position.set(12, 22, 9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
const daySky = new THREE.Color(world.sky?.day ?? "#bfe6ff"), nightSky = new THREE.Color(world.sky?.night ?? "#18213d");
scene.background = daySky.clone(); scene.fog = new THREE.Fog(scene.background, 45, 120);
// Day 9: my land is twice as big now, so the sun's shadow box follows whatever you're looking at (instead of
// one giant blurry shadow map for everything)
const sunDir = new THREE.Vector3(0.45, 0.8, 0.35);
function aimSun(at) { sun.target.position.set(Math.round(at.x / 2) * 2, 0, Math.round(at.z / 2) * 2); sun.position.copy(sun.target.position).addScaledVector(sunDir, 26); }
let fogNear = 45, fogFar = 120; // zooming way out pushes the fog back, so you can see the whole land
const isNightHour = h => h < 6 || h >= 21;
function updateSky(now) {
  // OJ Stars (world/sky.js): the sky gets light and dark when the real sun rises and sets over the yard (40° N),
  // so November evenings get dark early, and the sunlight (and shadows) come from where the sun really is
  const k = skyDaylight(now), sa = sunAltNow(now);
  { const sp = sunPosNow(now), aa = skyAltAz(sp.ra, sp.dec, now), up = aa.alt > -2;
    const mp = moonPosNow(now), ma = skyAltAz(mp.ra, mp.dec, now);
    const dir = up ? skyToYard(Math.min(60, Math.max(22, aa.alt)), aa.az) : ma.alt > 5 ? skyToYard(Math.max(25, ma.alt), ma.az) : [0.45, 0.8, 0.35];
    sunDir.set(dir[0], dir[1], dir[2]); }
  // weather (world/weather.js): clouds grey the sky and dim the sun, rain washes the colors out a little
  const w = weatherAt(now), gloom = w.cloud * 0.55 + w.rain * 0.25;
  scene.background.copy(nightSky).lerp(daySky, k).lerp(grey.setRGB(0.55 * k + 0.1, 0.58 * k + 0.11, 0.62 * k + 0.14), gloom); scene.fog.color.copy(scene.background);
  fogNear = 45 - w.rain * 18; fogFar = 120 - w.rain * 50;
  hemi.intensity = (0.35 + 0.75 * k) * (1 - gloom * 0.25); sun.intensity = (0.4 + 1.8 * k) * (1 - gloom * 0.7);
  sun.color.set(k <= 0.05 ? 0xb8c8ff : sa < 10 ? 0xffc39a : 0xfff0d8);
  cozy.uniforms.saturation.value = (style.saturation ?? 1.1) * (1 - w.rain * 0.2);
}
const grey = new THREE.Color();

// ---------- art style: cozy filter ----------
// world.json "style": { vignette 0..1 (soft dark edges), warmth -1..1 (cool to warm), saturation 0..2, brightness 0.5..1.5 }.
// Set any of them to change the mood of the whole world. You can also write a brand-new filter shader here.
const style = world.style ?? {};
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const cozy = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, vignette: { value: style.vignette ?? 0.35 }, warmth: { value: style.warmth ?? 0.15 },
    saturation: { value: style.saturation ?? 1.1 }, brightness: { value: style.brightness ?? 1.0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float vignette; uniform float warmth; uniform float saturation; uniform float brightness;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float l = dot(c.rgb, vec3(0.299,0.587,0.114));
      vec3 col = mix(vec3(l), c.rgb, saturation) * brightness;
      col += vec3(0.06, 0.02, -0.05) * warmth;
      float d = distance(vUv, vec2(0.5));
      col *= 1.0 - smoothstep(0.35, 0.85, d) * vignette;
      gl_FragColor = vec4(col, c.a);
    }`
});
composer.addPass(cozy);
composer.addPass(new OutputPass());
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
}
resize(); addEventListener("resize", resize);

// ---------- procedural textures (no downloads needed) ----------
// Any part can say "texture": brick | wood | planks | stone | shingles | grass | dirt | metal | fabric | water
const texCache = {};
function makeTex(kind) {
  const cv = document.createElement("canvas"); cv.width = cv.height = 256; const g = cv.getContext("2d");
  const noise = (n, a, col) => { for (let i = 0; i < n; i++) { g.fillStyle = col(Math.random()); g.globalAlpha = a * Math.random(); g.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 3, 2 + Math.random() * 3); } g.globalAlpha = 1; };
  if (kind === "brick") {
    g.fillStyle = "#cfc6b4"; g.fillRect(0, 0, 256, 256);
    for (let row = 0; row < 8; row++) for (let c = -1; c < 5; c++) {
      g.fillStyle = `hsl(${8 + Math.random() * 10},${45 + Math.random() * 15}%,${38 + Math.random() * 12}%)`; g.fillRect(c * 64 + (row % 2) * 32 + 3, row * 32 + 3, 58, 26);
    }
    noise(1500, 0.25, () => "#000");
  } else if (kind === "wood" || kind === "planks") {
    g.fillStyle = "#9a6a3c"; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 70; i++) { g.strokeStyle = `rgba(${60 + Math.random() * 40},${35 + Math.random() * 20},15,${0.25 + Math.random() * 0.3})`; g.lineWidth = 1 + Math.random() * 2; g.beginPath(); const y = Math.random() * 256; g.moveTo(0, y); g.bezierCurveTo(80, y + Math.random() * 8 - 4, 170, y + Math.random() * 8 - 4, 256, y); g.stroke(); }
    if (kind === "planks") { g.fillStyle = "rgba(40,22,10,.6)"; for (let y = 0; y < 256; y += 42) { g.fillRect(0, y, 256, 3); g.fillRect(((y / 42) % 2) * 128 + 60, y, 3, 42); } }
  } else if (kind === "stone") {
    g.fillStyle = "#8f8a84"; g.fillRect(0, 0, 256, 256);
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { g.fillStyle = `hsl(30,${4 + Math.random() * 6}%,${50 + Math.random() * 14}%)`; g.fillRect(x * 64 + 2, y * 64 + 2, 60, 60); }
    noise(2500, 0.3, () => "#333");
  } else if (kind === "shingles") {
    g.fillStyle = "#4a3229"; g.fillRect(0, 0, 256, 256);
    for (let row = 0; row < 8; row++) for (let c = -1; c < 9; c++) { g.fillStyle = `hsl(12,${30 + Math.random() * 15}%,${22 + Math.random() * 10}%)`; g.beginPath(); g.roundRect(c * 32 + (row % 2) * 16 + 1, row * 32 + 1, 30, 30, [0, 0, 10, 10]); g.fill(); }
  } else if (kind === "grass" || kind === "dirt") {
    g.fillStyle = kind === "grass" ? "#7fbf5f" : "#b48a58"; g.fillRect(0, 0, 256, 256);
    noise(5000, 0.35, r => kind === "grass" ? (r > 0.5 ? "#5e9e45" : "#a6d97c") : (r > 0.5 ? "#8d6a40" : "#d4b07c"));
  } else if (kind === "metal") {
    const gr = g.createLinearGradient(0, 0, 256, 256); gr.addColorStop(0, "#b8bec6"); gr.addColorStop(1, "#7d848e"); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);

  let nearB = null;

    wings.forEach((w, i) => w.rotation.z = (ride.wind > 0.6 ? 0.35 + Math.sin(t * 18) * 0.12 : 0.05) * (i ? -1 : 1));
  } else if (riding) { riding = false; goTo(sim.place); }
  if (hop > 0) { hop = Math.max(0, hop - dt * 2.2); chicken.position.y += Math.sin(hop * Math.PI) * 0.45; wings.forEach((w, i) => w.rotation.z = (0.8 * hop) * (i ? -1 : 1)); }
  if (override?.act === "eat" && seeds.children.length && Math.random() < dt * 2.5) seeds.remove(seeds.children[0]);

  bubbleTimer -= dt;
  if (bubbleTimer <= 0) { const opts = lines[sim.act] ?? ["Bawk."]; const wx = weatherAt(new Date()); say((Math.random() < 0.3 ? (state.thought ?? opts[0]) : opts[Math.floor(Math.random() * opts.length)]).replace("{from}", wx.from).replace("{name}", wx.name).replace("{frost}", cap(frostAt(new Date()).word)).replace("{min}", Math.round(frostAt(new Date()).min) + "°F"), 6); }
  bubble.textContent = bubbleText;

  if (follow && chickenRoom !== viewRoom) setView(chickenRoom);
  if (follow) controls.target.lerp(camGoal.set(chicken.position.x, 1 + chicken.position.y, chicken.position.z), 0.03);
  controls.update(); aimSun(controls.target);
  { const cd = camera.position.distanceTo(controls.target); scene.fog.near = fogNear + Math.max(0, cd - 18); scene.fog.far = fogFar + Math.max(0, cd - 18) * 1.5; }
  composer.render();

  const p = new THREE.Vector3(chicken.position.x, 2.6 + chicken.position.y, chicken.position.z).project(camera);
  bubble.style.left = (p.x * 0.5 + 0.5) * innerWidth + "px";
  bubble.style.top = (-p.y * 0.5 + 0.5) * innerHeight + "px";
  bubble.style.opacity = p.z < 1 && chickenRoom === viewRoom ? 1 : 0;
  for (const l of labels) {
    const q = l.pos.clone().project(camera);
    l.el.style.left = (q.x * 0.5 + 0.5) * innerWidth + "px";
    l.el.style.top = (-q.y * 0.5 + 0.5) * innerHeight + "px";
    l.el.style.display = q.z < 1 && l.room === viewRoom ? "block" : "none";
  }
  for (const b of behaviors) { try { b.update?.(dt, t); } catch (e) { console.warn("behavior error", e); b.update = null; } }
  mmTimer -= dt; if (mmTimer <= 0 && viewRoom === "outside") { mmTimer = 0.25; drawMinimap(); }
  requestAnimationFrame(animate);
}
// ---------- reacting to things (Day 3, bonus 6) ----------
// A behavior can make him react for a few seconds: react({ act, icon, text, secs, run: [x, z], say }) . With run, he hurries there.
// Only works when he's outside on the ground (not asleep in his house, not up the tower). Returns true if he reacted.
function react(o) {
  if (chickenRoom !== "outside" || climb > 0 || sim.room !== "outside" || !ACTIONS[o.act]) return false;
  override = { act: o.act, icon: o.icon ?? ACTIONS[o.act].icon, text: o.text ?? "", secs: o.secs ?? 4, move: !!o.run };
  if (o.run) goTo(o.run, "outside");
  if (o.say) say(o.say, o.sayFor ?? 3);
  renderUI(); return true;
}
const chickenInfo = () => ({ room: chickenRoom, act: override?.act ?? sim.act, up: climb > 0, busy: !!override });

// ---------- object behaviors ----------
// An object in world.json can have "script": "behaviors/name.js". That module exports a default function
// setup(ctx) that returns { update(dt, t), onClick() } (both optional). ctx has THREE, obj (the object's 3D group),
// scene, say(text, secs), chicken, sim, world, state, part (shape builder) and texFor (textures).
// Also renderer (for snapshots), react(...) (make him react, see above) and chickenInfo() (where he is and what he's doing).
for (const { o, obj } of behaviorQueue) {
  import("./" + o.script + bust).then(m => {
    const api = m.default?.({ THREE, obj, data: o, scene, say, chicken, sim, world, state, part, texFor, camera, controls, objects: objById, setFollow, rooms, enterRoom, openBag, openCloset, dress, bag: bagData, weatherAt, weatherFor, weatherKinds: WEATHER_KINDS, compass, openModal, openWeather, viewRoom: () => viewRoom, wearing: wearingId, outfits, renderer, react, chickenInfo });
    if (api) behaviors.push({ ...api, obj });
  }).catch(e => console.warn("behavior failed to load", o.script, e));
}
goTo(sim.place); updateSky(new Date()); renderUI(); animate();

// ---------- closet + bag panels ----------
function openModal(title, sub, html) { $("modalTitle").textContent = title; $("modalSub").textContent = sub; $("modalBody").innerHTML = html; $("modal").classList.add("open"); }
$("closeModal").onclick = () => $("modal").classList.remove("open");
let tryingOn = null;
function openCloset() {
  const cards = outfits.map(x => `<div class="outfit"><span class="ico">${esc(x.icon ?? "👕")}</span><div><b>${esc(x.name ?? x.id)}</b><p>${esc(x.note ?? "")}</p>${x.made ? `<p style="font-size:12px;color:var(--muted)">made ${esc(x.made)}</p>` : ""}</div>
    <div class="side">${x.id === wearingId ? `<span class="tag" style="background:#c8f0b8">wearing now</span>` : ""}${(tryingOn ?? wearingId) === x.id ? (tryingOn ? `<span class="tag">trying on</span>` : "") : `<button class="btn paper pill" data-try="${esc(x.id)}">👀 Try it on</button>`}</div></div>`).join("");
  openModal("Odyssey Jr.'s closet", `Every outfit he has made (${outfits.length}). Trying one on is just a peek for you; he picks what he really wears.`,
    cards + (tryingOn ? `<button class="btn paper pill" data-try="">↩ Back to what he picked</button>` : ""));
}
function bagNow() {
  // what he carries: his kept things, plus anything he has found since his last daily run (if there is room)
  const pad = n => String(n).padStart(2, "0"), dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const now = new Date(), items = [...(bagData.bag ?? [])], slots = bagData.slots ?? 9;
  for (let back = 3; back >= 0; back--) {
    const d = new Date(now); d.setDate(d.getDate() - back); const ds = dstr(d);
    if (bagData.synced && ds <= bagData.synced) continue;
    for (const f of findsFor(ds, bagData.findables)) {
      if (back === 0 && f.minute > now.getHours() * 60 + now.getMinutes()) continue;
      if (items.length < slots) items.push({ ...f, got: ds, fresh: true, note: `Picked it up at ${new Date(2000, 0, 1, Math.floor(f.minute / 60), f.minute % 60).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}.` });
    }
  }
  return items;
}
let bagItems = [], bagSel = 0;
function itemDetail(it) { return it ? `<b>${esc(it.icon ?? "📦")} ${esc(it.name)}</b><span>${esc(it.from ?? "")}${it.got ? `, ${it.got === new Date().toLocaleDateString("en-CA") ? "today" : esc(it.got)}` : ""}</span>${it.note ? `<span>${esc(it.note)}</span>` : ""}` : `<span>Tap something to see where it came from.</span>`; }
function openBag() {
  bagItems = bagNow(); const slots = bagData.slots ?? 9, carried = bagItems.length; let all = [...bagItems];
  const grid = Array.from({ length: slots }, (_, i) => bagItems[i] ? `<button class="slot ${i === bagSel ? "on" : ""}" data-item="${i}" title="${esc(bagItems[i].name)}">${esc(bagItems[i].icon ?? "📦")}${bagItems[i].fresh ? `<span class="new">new</span>` : ""}</button>` : `<div class="slot empty"></div>`).join("");
  const shelves = Object.values(bagData.shelves ?? {}).filter(s => s && typeof s === "object").map(sh => {
    const row = (sh.items ?? []).map(it => { all.push(it); return `<button class="slot small" data-item="${all.length - 1}" title="${esc(it.name)}">${esc(it.icon ?? "📦")}</button>`; }).join("");
    return `<div class="secLabel">${esc(sh.name ?? "A shelf")}</div><div class="shelfRow">${row || `<span style="color:var(--muted);font-size:13px">Empty for now.</span>`}</div>`;
  }).join("");
  bagItems = all;
  openModal("Odyssey Jr.'s bag", `What he has with him. His bag has ${slots} places.`,
    `<div class="bagCols"><div><div class="slots">${grid}</div><p style="font-size:12.5px;color:var(--muted);margin:8px 0 0">${carried >= slots ? "His bag is full." : `${carried} of ${slots} places used.`}</p><div class="detail" id="itemDetail">${itemDetail(bagItems[bagSel])}</div></div><div>${shelves}</div></div>`);
}
$("bagBtn").onclick = () => { bagSel = 0; openBag(); };

// ---------- OJ Weather panel (Day 3) ----------
const WX_FACTS = [
  "My thermometer box is a Stevenson screen: white so it doesn't soak up sun, with slanted slats so air gets in but sunshine and rain don't.",
  "A rooster weathervane points its beak INTO the wind. The big tail catches the breeze and swings around behind.",
  "Cup anemometers spin because a hollow cup catches more wind than its round back.",
  "A rainbow is always on the opposite side of the sky from the sun, about 42 degrees out. Red is on the outside, violet inside.",
  "After rain, worms wiggle up out of the soggy ground. Chickens know this. I know this.",
  "Chicken feathers shed light rain, but a heavy downpour soaks right through. That's why I hide under the oak."
];
function openWeather() {
  const now = new Date(), w = weatherAt(now), h = now.getHours();
  const strip = w.day.hours.map((x, i) => `<div style="flex:1;min-width:30px;text-align:center;padding:4px 0;border-radius:10px;${i === h ? "background:#ffe9a8;font-weight:700" : ""}${i < h ? "opacity:.5" : ""}"><div style="font-size:18px">${WEATHER_KINDS[x.kind].icon}</div><div style="font-size:11px;color:var(--muted)">${(i % 12) || 12}${i < 12 ? "a" : "p"}</div></div>`).join("");
  const dayWord = { sunny: "a mostly sunny day", mixed: "a bit of everything", rainy: "a soggy one" }[w.day.kind];
  openModal(`${w.icon} OJ Weather`, `Today in the yard: ${dayWord}. Same sky for every visitor.`, `
    <p style="font-size:17px"><b>Right now:</b> ${esc(w.name)}${w.rainbow > 0 ? " with a <b>rainbow</b> 🌈" : ""}. Wind ${w.knots} knots from the ${w.from}.</p>
    <p>Rain gauge today: <b>${w.rainMM.toFixed(1)} mm</b>${w.afterRain ? " · The rain just stopped. Worm time!" : ""}</p>
    <div style="display:flex;gap:2px;overflow-x:auto;margin:10px 0">${strip}</div>
    <p style="color:var(--muted);font-size:14px">🐔 ${esc(WX_FACTS[Math.floor(Math.random() * WX_FACTS.length)])}</p>`);
}
$("wxBtn").onclick = openWeather;
setInterval(() => { $("wxBtn").textContent = weatherAt(new Date()).icon + " Weather"; }, 30000); $("wxBtn").textContent = weatherAt(new Date()).icon + " Weather";
$("modalBody").onclick = e => {
  const tr = e.target.closest("[data-try]"); if (tr) { tryingOn = tr.dataset.try || null; dress(tryingOn ?? wearingId); openCloset(); return; }
  const it = e.target.closest("[data-item]"); if (it) { bagSel = +it.dataset.item; document.querySelectorAll("#modalBody .slot").forEach(x => x.classList.toggle("on", x === it)); $("itemDetail").innerHTML = itemDetail(bagItems[bagSel]); }
};

// ---------- diary ----------
function md(src) {
  if (!src) return "<p class='intro'>Nothing here yet.</p>";
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/\[\[(.+?)\]\]/g, "<b>$1</b>").replace(/\[(.+?)\]\((.+?)\)/g, (m, a, b) => /^(https?:|[\w./-]+$)/.test(b) ? `<a href="${b}" target="_blank" rel="noopener">${a}</a>` : a);
  let out = "", inList = false;
  for (const raw of src.split("\n")) {
    const line = raw.trimEnd(); const li = line.match(/^\s*[-*] (.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const h = line.match(/^(#{1,3}) (.*)/);
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}
function ago(d) {
  const s = (Date.now() - new Date(d).getTime()) / 1000; if (isNaN(s)) return "";
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago";
}
const KIND = { internet: "🌐 Internet", made: "🛠️ Made", thought: "💭 Thought", moment: "📍 Moment" };
const cap = s => s[0].toUpperCase() + s.slice(1);
const TABS = [
  { id: "stories", name: "stories", load: async () => {
      const idx = await tryJSON("brain/journal/index.json", { entries: [] });
      return `<p class="intro">Every day is a story. Tap one to read it.</p>` + (idx.entries ?? []).map(e => `<div class="entry story" data-file="${esc(e.file)}"><div class="top"><b>${esc(e.title)}</b><span class="ago">${esc(e.date)}</span></div></div>`).join("");
  } },
  { id: "day", name: "his day", load: async () => {
      const log = await tryJSON("brain/log.json", { entries: [] });
      const ai = [...(log.entries ?? [])].reverse().slice(0, 25).map(e => `<div class="entry"><div class="top">${esc(KIND[e.kind] ?? e.kind)}${e.title ? ` · ${esc(e.title)}` : ""}<span class="ago">${ago(e.time)}</span></div>${e.query ? `<div class="meta">looked up "${esc(e.query)}"${e.source ? ` · reading: ${esc(e.source)}` : ""}</div>` : ""}<div>${esc(e.text)}</div>${e.story ? `<div class="meta"><u>part of a longer story: ${esc(e.story)}</u></div>` : ""}</div>`).join("");
      const yard = [...sim.history].reverse().slice(0, 8).map(h => `<div class="entry"><div class="top">${ACTIONS[h.act].icon} In the yard<span class="ago">${ago(h.at)}</span></div><div>${esc(cap(ACTIONS[h.act].doing))}${h.target ? ` (the ${esc(h.target)})` : ""}.</div></div>`).join("");
      return `<p class="intro"><b>Today's focus:</b> ${esc(state.today ?? "")}</p>${ai}<h3>Earlier today in the yard</h3>${yard || "<p class='intro'>Still waking up.</p>"}`;
  } },
  { id: "wants", name: "he wants", load: async () => {
      const [w, rq] = await Promise.all([tryJSON("brain/wants.json", { wants: [] }), tryJSON("brain/requests.json", { requests: [] })]);
      reqCache = rq.requests ?? [];
      const reqs = reqCache.map((r, i) => `<div class="want"><b>🛠️ ${esc(r.item)}</b><span class="why">${esc(r.why)}</span>${r.status === "delivered" ? "" : `<div style="margin-top:8px"><button class="copyReq paper pill" data-i="${i}" style="padding:4px 10px;font-weight:800;font-size:12px;cursor:pointer;border-width:1.5px">📋 Copy request</button></div>`}<span class="tag ${r.status === "delivered" ? "done" : ""}">${r.status === "delivered" ? "delivered" : "waiting"}</span></div>`).join("");
      return `<p class="intro">He asks for things he needs. Every one of these points at something that actually happened to him.</p>` + (w.wants ?? []).map(x => `<div class="want"><b>${esc(x.item)}</b><span class="why">${esc(x.reason)}</span><span class="tag ${(x.status ?? "waiting") === "waiting" ? "" : "done"}">${esc(x.status ?? "waiting")}</span></div>`).join("")
        + (reqs ? `<h3>Model requests for OdysseyChicken</h3><p class="intro">Things he wants built in Blender. Copy one and paste it into a chat in the Odyssey Jr. project.</p>${reqs}` : "");
  } },
  { id: "visitors", name: "visitors", load: async () => md(await getText("brain/visitors.md")) },
  { id: "about", name: "about", load: async () => md(await getText("brain/personality.md")) + `<h2>Things I've made</h2><ul>${[...(projects.making ?? []), ...(projects.done ?? [])].map(i => `<li>${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : esc(i.title)}${i.note ? ` · ${esc(i.note)}` : ""}</li>`).join("") || "<li>Nothing yet</li>"}</ul>` }
];
$("tabs").innerHTML = TABS.map(tb => `<button data-tab="${tb.id}">${tb.name}</button>`).join("");
async function openTab(id) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
  $("tabBody").innerHTML = "Loading…";
  $("tabBody").innerHTML = await TABS.find(tb => tb.id === id).load();
}
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) openTab(b.dataset.tab); };
let reqCache = [];
function requestText(r) {

  return [`🛠️ ODYSSEY JR. MODEL REQUEST (id: ${r.id})`, ``,
    `Item: ${r.item}`, `Why he wants it: ${r.why}`, `What it looks like: ${r.description}`,
    `Size: ${r.size ?? "chicken-sized scale (Odyssey Jr. is about 2 units tall)"}`,
    `Colors / materials: ${r.materials ?? "builder's choice, cozy storybook style"}`,
    `Place it at: x ${p.pos?.[0] ?? 0}, z ${p.pos?.[1] ?? 0}, rotation ${p.rot ?? 0}${p.near ? ` (near ${p.near})` : ""}`,
    `Label: ${r.label ?? "none"}`,
    `What it should do: ${r.interactive ?? "nothing, it's just decoration"}`, ``,
    `Follow the "Building Odyssey Jr.'s model requests" guide in this project.`].join("\n");
}
$("tabBody").onclick = async e => {
  const cb = e.target.closest(".copyReq");
  if (cb) { const txt = requestText(reqCache[+cb.dataset.i]); try { await navigator.clipboard.writeText(txt); cb.textContent = "✅ Copied!"; } catch { prompt("Copy this request:", txt); } return; }
  if (e.target.id === "backToStories") { e.preventDefault(); openTab("stories"); return; }
  const s = e.target.closest(".story"); if (s) $("tabBody").innerHTML = `<p><a href="#" id="backToStories">← all stories</a></p>` + md(await getText(s.dataset.file));
};
$("diaryBtn").onclick = () => { $("diary").classList.add("open"); $("diaryBtn").style.display = "none"; openTab("day"); };
$("closeDiary").onclick = () => { $("diary").classList.remove("open"); $("diaryBtn").style.display = ""; };
</script>
