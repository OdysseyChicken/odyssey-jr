<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odyssey Jr.'s World</title>
<style>
  :root { --ink:#2b2118; --card:rgba(255,250,240,.94); --accent:#e8553a; --soft:#ffe3c2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font-family: ui-rounded, "Nunito", system-ui, sans-serif; color:var(--ink); background:#bfe6ff; }
  #scene { position:fixed; inset:0; }
  .card { background:var(--card); border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.15); }
  #hud { position:fixed; top:12px; left:12px; width:250px; padding:12px 14px; }
  #hud h1 { margin:0; font-size:19px; display:flex; align-items:center; gap:6px; }
  #hud .sub { font-size:12px; opacity:.75; margin:2px 0 8px; }
  .stat { display:grid; grid-template-columns:62px 1fr 26px; align-items:center; gap:6px; font-size:12px; margin:4px 0; }
  .bar { height:9px; background:#eadfcf; border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:99px; transition:width .8s ease; }
  .stat b { font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
  #focus { font-size:12px; margin-top:8px; padding-top:8px; border-top:1px dashed #d8c9b0; }
  #panelBtn { position:fixed; top:12px; right:12px; border:0; border-radius:999px; padding:10px 14px; background:var(--accent); color:#fff; font-weight:800; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.2); font-family:inherit; }
  #panel { position:fixed; top:58px; right:12px; width:min(400px, calc(100vw - 24px)); max-height:calc(100vh - 140px); display:none; flex-direction:column; overflow:hidden; }
  #panel.open { display:flex; }
  #tabs { display:flex; gap:4px; padding:10px 10px 0; flex-wrap:wrap; }
  #tabs button { border:0; background:transparent; padding:7px 10px; border-radius:10px 10px 0 0; font:inherit; font-size:13px; font-weight:700; cursor:pointer; color:#7a6550; }
  #tabs button.on { background:#fff; color:var(--ink); }
  #tabBody { background:#fff; margin:0 10px 10px; border-radius:0 12px 12px 12px; padding:12px 14px; overflow:auto; font-size:13.5px; line-height:1.5; }
  #tabBody h1 { font-size:17px; margin:4px 0 8px; } #tabBody h2 { font-size:15px; margin:12px 0 6px; } #tabBody h3 { font-size:14px; margin:10px 0 4px; }
  #tabBody ul { padding-left:18px; margin:4px 0; } #tabBody p { margin:6px 0; }
  #actionBar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); padding:10px 16px; display:flex; align-items:center; gap:10px; max-width:calc(100vw - 24px); font-size:14px; }
  #actionIcon { font-size:20px; } #actionText { font-weight:700; } #actionSince { font-size:12px; opacity:.6; white-space:nowrap; }
  #tools { position:fixed; right:12px; bottom:14px; display:flex; gap:6px; }
  #tools button { border:0; border-radius:999px; padding:9px 12px; background:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  #bubble { position:fixed; z-index:5; transform:translate(-50%,-100%); background:#fff; border-radius:14px; padding:8px 12px; font-size:13px; max-width:240px; box-shadow:0 4px 14px rgba(0,0,0,.18); pointer-events:none; transition:opacity .4s; }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-8px; transform:translateX(-50%); border:8px solid transparent; border-top-color:#fff; border-bottom:0; }
  .label3d { position:fixed; transform:translate(-50%,-100%); font-size:11px; font-weight:700; background:rgba(255,255,255,.75); padding:1px 6px; border-radius:6px; pointer-events:none; white-space:nowrap; }
  #err { position:fixed; bottom:70px; left:12px; right:12px; background:#ffdede; border-radius:12px; padding:10px; font-size:13px; display:none; }
  @media (max-width:700px) { #hud { width:200px; padding:10px; } .stat { grid-template-columns:52px 1fr 22px; } #tools { bottom:70px; } #actionBar { font-size:13px; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="scene"></div>
<div id="hud" class="card">
  <h1>🐔 Odyssey Jr.</h1>
  <div class="sub"><span id="dayTag">Day ?</span> · <span id="clock"></span></div>
  <div id="stats"></div>
  <div id="focus"></div>
</div>
<button id="panelBtn">📓 Journal</button>
<div id="panel" class="card">
  <div id="tabs"></div>
  <div id="tabBody">Loading…</div>
</div>
<div id="actionBar" class="card"><span id="actionIcon">🐣</span><span id="actionText">Waking up…</span><span id="actionSince"></span></div>
<div id="tools"><button id="seedBtn" title="Toss him some seeds">🌾 Toss seeds</button><button id="camBtn" title="Follow Odyssey Jr. with the camera">🎥 Follow</button></div>
<div id="bubble"></div>
<div id="err"></div>

<script type="module">
// ODYSSEY-JR-ENGINE v2
// Data files: world/world.json (objects), world/state.json (today's focus), world/character.json (look),
// world/projects.json, brain/*.md (journal tabs). Prefer editing data. Edit this engine to add new abilities.
//
// LIVE LIFE: between his daily AI runs, Odyssey Jr. lives on his own in the browser. His needs
// (fullness, energy, wonder, mood, calm) drift over time and he picks actions to meet them.
// The sim is replayed from midnight with a seed based on the date, so every visitor sees the same chicken.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
const showError = msg => { const e = $("err"); e.style.display = "block"; e.textContent = "Something broke: " + msg; };
window.addEventListener("error", e => showError(e.message));

const bust = "?v=" + Date.now();
const getJSON = async p => { const r = await fetch(p + bust); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); };
const getText = async p => { try { const r = await fetch(p + bust); return r.ok ? await r.text() : null; } catch { return null; } };

let world, state, projects, character;
try {
  [world, state, projects, character] = await Promise.all([
    getJSON("world/world.json"), getJSON("world/state.json"),
    getJSON("world/projects.json").catch(() => ({ making: [], done: [] })),
    getJSON("world/character.json").catch(() => ({ colors: {}, outfit: {} }))
  ]);
} catch (e) { showError(e.message); throw e; }

// ---------- scene ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(14, 14, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
$("scene").appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 4; controls.maxDistance = 45;

const hemi = new THREE.HemisphereLight(0xffffff, 0x557744, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(10, 20, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const daySky = new THREE.Color(world.sky?.day ?? "#bfe6ff"), nightSky = new THREE.Color(world.sky?.night ?? "#18213d");
scene.background = daySky.clone(); scene.fog = new THREE.Fog(scene.background, 30, 70);
const isNightHour = h => h < 6 || h >= 21;
function updateSky(now) {
  const h = now.getHours() + now.getMinutes() / 60;
  // 0 at night, 1 in the day, smooth dawn (5-7) and dusk (19.5-21.5)
  const k = h < 5 || h > 21.5 ? 0 : h < 7 ? (h - 5) / 2 : h > 19.5 ? (21.5 - h) / 2 : 1;
  scene.background.copy(nightSky).lerp(daySky, k); scene.fog.color.copy(scene.background);
  hemi.intensity = 0.3 + 0.7 * k; sun.intensity = 0.35 + 1.25 * k;
  sun.color.set(k < 1 ? 0xffc9a0 : 0xfff2dd);
}

const size = world.ground?.size ?? 40;
const ground = new THREE.Mesh(new THREE.CircleGeometry(size / 2 + 4, 64), new THREE.MeshStandardMaterial({ color: world.ground?.color ?? "#8cc96b" }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ---------- builders ----------
const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true });
function part(shape, s, color) {
  let g;
  if (shape === "box") g = new THREE.BoxGeometry(s[0], s[1], s[2]);
  else if (shape === "sphere") g = new THREE.SphereGeometry(s[0], 12, 10);
  else if (shape === "cylinder") g = new THREE.CylinderGeometry(s[0], s[1], s[2], 12);
  else if (shape === "cone") g = new THREE.ConeGeometry(s[0], s[1], 12);
  else if (shape === "torus") g = new THREE.TorusGeometry(s[0], s[1], 8, 20);
  else g = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const m = new THREE.Mesh(g, mat(color ?? "#cccccc"));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function fromParts(parts) {
  const grp = new THREE.Group();
  for (const p of parts) {
    const m = part(p.shape, p.size ?? [0.5, 0.5, 0.5], p.color);
    m.position.set(...(p.pos ?? [0, 0, 0]));
    if (p.rot) m.rotation.set(...p.rot);
    grp.add(m);
  }
  return grp;
}
const builtins = {
  tree: o => fromParts([
    { shape: "cylinder", size: [0.3, 0.4, 2], pos: [0, 1, 0], color: "#7a4f2a" },
    { shape: "sphere", size: [1.6], pos: [0, 2.8, 0], color: o.color ?? "#4f9a3a" },
    { shape: "sphere", size: [1.1], pos: [0.9, 2.3, 0.3], color: o.color ?? "#5aab45" }]),
  pine: o => fromParts([
    { shape: "cylinder", size: [0.25, 0.3, 1], pos: [0, 0.5, 0], color: "#6b4626" },
    { shape: "cone", size: [1.4, 2.2], pos: [0, 1.9, 0], color: o.color ?? "#2f7a46" },
    { shape: "cone", size: [1.0, 1.6], pos: [0, 3.0, 0], color: o.color ?? "#358a50" }]),
  rock: o => fromParts([{ shape: "sphere", size: [0.8], pos: [0, 0.3, 0], color: o.color ?? "#9a9a9a" }]),
  flower: o => fromParts([
    { shape: "cylinder", size: [0.04, 0.04, 0.6], pos: [0, 0.3, 0], color: "#3c8a2e" },
    { shape: "sphere", size: [0.18], pos: [0, 0.65, 0], color: o.color ?? "#ff6fa8" }]),
  pond: o => fromParts([{ shape: "cylinder", size: [2.4, 2.4, 0.06], pos: [0, 0.03, 0], color: o.color ?? "#4aa3df" }]),
  sign: o => fromParts([
    { shape: "box", size: [0.15, 1.2, 0.15], pos: [0, 0.6, 0], color: "#6b4626" },
    { shape: "box", size: [1.8, 0.7, 0.1], pos: [0, 1.35, 0], color: "#c89a5c" }]),
  coop: o => fromParts([
    { shape: "box", size: [3, 2, 2.4], pos: [0, 1, 0], color: o.color ?? "#c94f3d" },
    { shape: "cone", size: [2.4, 1.4], pos: [0, 2.7, 0], color: "#5a3a2a", rot: [0, Math.PI / 4, 0] },
    { shape: "box", size: [0.8, 1, 0.05], pos: [0, 0.5, 1.22], color: "#3b2418" }])
};

const labels = [];
const clickables = []; // { obj, info }
const builtObjects = []; // labeled things he can go admire
for (const o of world.objects ?? []) {
  let obj;
  if (world.custom?.[o.type]) obj = fromParts(world.custom[o.type]);
  else if (builtins[o.type]) obj = builtins[o.type](o);
  else { console.warn("Unknown object type", o.type); continue; }
  obj.position.set(o.pos?.[0] ?? 0, 0, o.pos?.[1] ?? 0);
  obj.rotation.y = o.rot ?? 0;
  obj.scale.setScalar(o.scale ?? 1);
  scene.add(obj);
  if (o.label) {
    const el = document.createElement("div"); el.className = "label3d"; el.textContent = o.label;
    document.body.appendChild(el);
    labels.push({ el, pos: new THREE.Vector3(obj.position.x, 3.6 * (o.scale ?? 1), obj.position.z) });
    builtObjects.push({ name: o.label, pos: [obj.position.x, obj.position.z] });
  }
  clickables.push({ obj, info: o.note ?? o.label ?? null });
}

// ---------- Odyssey Jr. himself ----------
// His look comes from world/character.json (colors + outfit), so he can restyle himself without touching code.
const C = character.colors ?? {};
const col = (k, d) => C[k] ?? d;
const chicken = new THREE.Group();
const at = (m, x, y, z) => { m.position.set(x, y, z); return m; };
const body = new THREE.Group(); body.position.y = 0.78; chicken.add(body);
const torso = part("sphere", [0.55], col("feathers", "#fffaf0")); torso.scale.set(0.95, 0.88, 1.15); body.add(torso);
const breast = at(part("sphere", [0.4], col("feathers", "#fffaf0")), 0, 0.05, 0.32); breast.scale.set(1, 1.05, 0.9); body.add(breast);
for (const [i, a] of [-0.35, 0, 0.35].entries()) {
  const f = part("cone", [0.14, 0.62], col("tail", "#ece0c8"));
  f.position.set(Math.sin(a) * 0.18, 0.28 + (i === 1 ? 0.06 : 0), -0.62); f.rotation.set(-0.75, 0, a * 0.9); body.add(f);
}
const wings = [-1, 1].map(s => {
  const pivot = new THREE.Group(); pivot.position.set(0.48 * s, 0.12, -0.02); body.add(pivot);
  const w = part("sphere", [0.34], col("wings", "#f1e6d0")); w.scale.set(0.28, 0.62, 1.05); w.position.set(0.02 * s, -0.1, -0.05); w.rotation.x = 0.25;
  pivot.add(w); return pivot;
});
const neckAnchor = new THREE.Group(); neckAnchor.position.set(0, 0.36, 0.34); body.add(neckAnchor);
const head = new THREE.Group(); head.position.set(0, 1.42, 0.5); chicken.add(head);
const skull = part("sphere", [0.3], col("feathers", "#fffaf0")); skull.scale.set(0.95, 1, 1.05); head.add(skull);
const beakTop = at(part("cone", [0.085, 0.22], col("beak", "#f2a20f")), 0, -0.01, 0.34); beakTop.rotation.x = Math.PI / 2; head.add(beakTop);
const beakLow = at(part("cone", [0.06, 0.14], col("beak", "#f2a20f")), 0, -0.07, 0.3); beakLow.rotation.x = Math.PI / 2 + 0.25; head.add(beakLow);
for (const [i, z] of [-0.1, 0.02, 0.13].entries()) head.add(at(part("sphere", [i === 1 ? 0.09 : 0.075], col("comb", "#e0362a")), 0, 0.3 + (i === 1 ? 0.03 : 0), z));
for (const x of [-0.04, 0.04]) { const wt = at(part("sphere", [0.06], col("comb", "#e0362a")), x, -0.2, 0.25); wt.scale.y = 1.4; head.add(wt); }
const eyes = [];
for (const s of [-1, 1]) {
  const eye = at(new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), new THREE.MeshStandardMaterial({ color: "#ffffff" })), 0.17 * s, 0.07, 0.2); head.add(eye);
  const pupil = at(new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshStandardMaterial({ color: "#111111", roughness: 0.2 })), 0.2 * s, 0.075, 0.245); head.add(pupil);
  head.add(at(new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), new THREE.MeshBasicMaterial({ color: "#ffffff" })), 0.21 * s, 0.1, 0.285));
  eyes.push(eye, pupil);
}
const hatAnchor = new THREE.Group(); hatAnchor.position.set(0, 0.27, -0.03); hatAnchor.rotation.z = 0.12; head.add(hatAnchor);
const legs = [-0.17, 0.17].map(x => {
  const leg = new THREE.Group(); leg.position.set(x, 0.42, 0.02); chicken.add(leg);
  leg.add(at(part("cylinder", [0.035, 0.04, 0.42], col("legs", "#f2a20f")), 0, -0.21, 0));
  for (const a of [-0.45, 0, 0.45]) { const toe = at(part("box", [0.035, 0.03, 0.2], col("legs", "#f2a20f")), Math.sin(a) * 0.08, -0.41, Math.cos(a) * 0.08); toe.rotation.y = a; leg.add(toe); }
  leg.add(at(part("box", [0.03, 0.03, 0.12], col("legs", "#f2a20f")), 0, -0.41, -0.07));
  return leg;
});
const wear = (anchor, parts) => { if (Array.isArray(parts) && parts.length) anchor.add(fromParts(parts)); };
wear(hatAnchor, character.outfit?.head);
wear(neckAnchor, character.outfit?.neck);
wear(body, character.outfit?.body);
scene.add(chicken);

// ---------- life sim ----------
const spots = world.spots ?? {};
const spotNames = Object.keys(spots);
const spotPos = name => spots[name] ?? spots[spotNames[0]] ?? [0, 0];
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
function rngFor(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }

// Each action: where he goes, how he moves, what it does to his needs per minute, and how long it lasts.
// To teach him a new everyday action, add one here (or ask him to in the inbox).
const ACTIONS = {
  sleep:    { icon: "😴", text: "Sleeping in the coop", where: "coop", anim: "sleep", fx: { energy: 1.4, calm: 0.4, fullness: -0.04 }, dur: [30, 60] },
  eat:      { icon: "🌽", text: "Eating at the seed feeder", where: "feeder", anim: "peck", fx: { fullness: 2.6, mood: 0.2 }, dur: [6, 12] },
  drink:    { icon: "💧", text: "Sipping water at the pond", where: "pond", anim: "peck", fx: { fullness: 0.6, calm: 0.7 }, dur: [4, 8] },
  forage:   { icon: "🌾", text: "Scratching for bugs in the garden", where: "garden", anim: "peck", fx: { fullness: 0.7, wonder: 0.3, calm: 0.3 }, dur: [10, 20] },
  nap:      { icon: "💤", text: "Taking a little nap", where: "coop", anim: "sleep", fx: { energy: 2.2, calm: 0.6 }, dur: [15, 35] },
  explore:  { icon: "🧭", text: "Exploring the yard", where: "*random", anim: "explore", fx: { wonder: 1.2, energy: -0.1 }, dur: [10, 20] },
  work:     { icon: "🔨", text: "Working on today's project", where: "*focus", anim: "build", fx: { wonder: 0.5, mood: 0.6, energy: -0.15 }, dur: [20, 40] },
  admire:   { icon: "✨", text: "Admiring something he built", where: "*built", anim: "look", fx: { mood: 0.9, wonder: 0.3 }, dur: [5, 10] },
  dustbath: { icon: "🪶", text: "Taking a dust bath", where: "dustbath", anim: "dance", fx: { calm: 1.6, mood: 0.3 }, dur: [8, 14] },
  think:    { icon: "💭", text: "Sitting and thinking big thoughts", where: "lookout", anim: "think", fx: { calm: 0.9, wonder: 0.6 }, dur: [8, 15] },
  dance:    { icon: "🎶", text: "Doing a happy little dance", where: "*here", anim: "dance", fx: { mood: 1.6, energy: -0.3 }, dur: [3, 6] }
};
const DECAY = { fullness: -0.13, energy: -0.08, wonder: -0.1, calm: -0.05 };
const NEEDS = ["fullness", "energy", "wonder", "mood", "calm"];
const NEED_COLORS = { fullness: "#f2a20f", energy: "#4caf50", wonder: "#8a7dff", mood: "#ff6fa8", calm: "#4aa3df" };

function chooseAction(n, hour, rnd) {
  if (isNightHour(hour)) return "sleep";
  const lack = k => (100 - n[k]) / 100;
  const scores = {
    eat: lack("fullness") ** 2 * 6, drink: lack("fullness") * 0.8 + lack("calm") * 0.6,
    forage: lack("fullness") * 1.2 + 0.3, nap: lack("energy") ** 2 * 5,
    explore: lack("wonder") * 2 + 0.2, work: 1.2 + lack("wonder"), admire: builtObjects.length ? lack("mood") * 1.5 + 0.2 : 0,
    dustbath: lack("calm") ** 2 * 4, think: lack("calm") + lack("wonder") * 0.5, dance: n.mood > 75 ? 0.6 : 0.1
  };
  let total = 0; for (const k in scores) total += scores[k];
  let r = rnd() * total;
  for (const k in scores) { r -= scores[k]; if (r <= 0) return k; }
  return "explore";
}
function placeFor(name, rnd, here) {
  const a = ACTIONS[name];
  if (a.where === "*focus") return spotPos(state.spot);
  if (a.where === "*built" && builtObjects.length) { const b = builtObjects[Math.floor(rnd() * builtObjects.length)]; return [b.pos[0] + 1.6, b.pos[1] + 1.6]; }
  if (a.where === "*random") { const lim = size / 2 - 2; return [(rnd() - 0.5) * 2 * lim, (rnd() - 0.5) * 2 * lim]; }
  if (a.where === "*here") return here;
  return spotPos(a.where);
}
function applyMinute(n, actName) {
  const fx = ACTIONS[actName].fx;
  for (const k of ["fullness", "energy", "wonder", "calm"]) n[k] = clamp(n[k] + (DECAY[k] ?? 0) * (actName === "sleep" ? 0.3 : 1) + (fx[k] ?? 0));
  const avg = (n.fullness + n.energy + n.wonder + n.calm) / 4;
  n.mood = clamp(n.mood + (avg - n.mood) * 0.03 + (fx.mood ?? 0));
}

// Replay today's life from midnight, minute by minute, so every visitor sees the same chicken.
const sim = { needs: { fullness: 70, energy: 55, wonder: 60, mood: 65, calm: 70 }, act: "sleep", left: 0, since: null, place: spotPos("coop"), rnd: null };
function newAction(now) {
  sim.act = chooseAction(sim.needs, now.getHours(), sim.rnd);
  const [lo, hi] = ACTIONS[sim.act].dur; sim.left = Math.round(lo + sim.rnd() * (hi - lo));
  sim.place = placeFor(sim.act, sim.rnd, sim.place); sim.since = new Date(now);
}
(function replay() {
  const now = new Date(); const t = new Date(now); t.setHours(0, 0, 0, 0);
  sim.rnd = rngFor(t.toDateString() + (state.day ?? 0));
  while (t < now) { if (sim.left <= 0) newAction(t); applyMinute(sim.needs, sim.act); sim.left--; t.setMinutes(t.getMinutes() + 1); }
})();

// ---------- UI: stats, action bar, focus ----------
$("stats").innerHTML = NEEDS.map(k => `<div class="stat"><span>${k[0].toUpperCase() + k.slice(1)}</span><div class="bar"><i id="bar-${k}" style="background:${NEED_COLORS[k]}"></i></div><b id="val-${k}"></b></div>`).join("");
$("dayTag").textContent = "Day " + (state.day ?? "?");
$("focus").innerHTML = `<b>Today's focus:</b> ${esc(state.today ?? "…")}`;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
let override = null; // local, per-visitor moments (seed toss, being petted)
function renderUI() {
  for (const k of NEEDS) { const v = Math.round(sim.needs[k]); $("bar-" + k).style.width = v + "%"; $("val-" + k).textContent = v; }
  const a = ACTIONS[override?.act ?? sim.act];
  $("actionIcon").textContent = override?.icon ?? a.icon;
  $("actionText").textContent = override?.text ?? (sim.act === "work" && state.activity ? `${a.text}: ${state.today ?? ""}` : a.text);
  $("actionSince").textContent = override ? "just now" : "since " + sim.since.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
setInterval(() => { const now = new Date(); if (sim.left <= 0) { newAction(now); goTo(sim.place); } applyMinute(sim.needs, sim.act); sim.left--; updateSky(now); renderUI(); }, 60000);

// ---------- movement + animation ----------
const target = new THREE.Vector3();
let moving = false, t = 0;
function goTo(p) { target.set(p[0], 0, p[1]); moving = true; }
chicken.position.set(sim.place[0], 0, sim.place[1]);
controls.target.set(sim.place[0], 1, sim.place[1]);
let follow = true;
$("camBtn").onclick = () => { follow = !follow; $("camBtn").textContent = follow ? "🎥 Follow" : "🎥 Free cam"; };
controls.addEventListener("start", () => { if (follow) { follow = false; $("camBtn").textContent = "🎥 Free cam"; } });

const bubble = $("bubble");
const lines = { sleep: ["Zzz…", "Zzz… dreaming of seeds…"], eat: ["Nom nom.", "These seeds are top notch."], forage: ["A bug! Where'd it go?", "Scratch scratch."], explore: ["What's over here?", "Adventure time!"], work: ["Almost got it…", "One more piece…"], admire: ["I built that!", "Not bad, if I say so myself."], dustbath: ["Ahh, dust bath.", "Fluff fluff."], think: ["Hmm…", state.thought ?? "Hmm…"], dance: ["Bawk bawk!", "♪ cluck-a-doodle ♪"], drink: ["Sip.", "Refreshing!"], nap: ["Just resting my eyes…"] };
let bubbleText = state.thought ?? "Bawk.", bubbleTimer = 8;
function say(text, secs = 4) { bubbleText = text; bubbleTimer = secs; }

const seeds = new THREE.Group(); scene.add(seeds);
$("seedBtn").onclick = () => {
  seeds.clear();
  const c = chicken.position;
  for (let i = 0; i < 18; i++) seeds.add(at(part("sphere", [0.05], "#e8c547"), c.x + (Math.random() - 0.5) * 1.6, 0.04, c.z + 0.9 + (Math.random() - 0.5) * 1.2));
  override = { act: "eat", icon: "🌾", text: "Gobbling up the seeds you tossed!", secs: 8 };
  sim.needs.fullness = clamp(sim.needs.fullness + 12); sim.needs.mood = clamp(sim.needs.mood + 4);
  say("Seeds?! For me?! 🥹", 4); renderUI();
};
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener("click", e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  if (ray.intersectObject(chicken, true).length) {
    override = { act: "dance", icon: "🥰", text: "Got petted and loved it", secs: 4 };
    sim.needs.mood = clamp(sim.needs.mood + 6); sim.needs.calm = clamp(sim.needs.calm + 3);
    say(["Bawk!", "Hehe, that tickles!", "Hi there, visitor!", "Nice to meet you!"][Math.floor(Math.random() * 4)], 3); renderUI(); return;
  }
  for (const c of clickables) if (c.info && ray.intersectObject(c.obj, true).length) { say(`That's my ${c.info}!`, 3); return; }
});

const clock = new THREE.Clock(), v = new THREE.Vector3();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;
  head.rotation.set(0, 0, 0); body.position.y = 0.78; head.position.set(0, 1.42, 0.5);
  wings.forEach(w => w.rotation.z = 0); chicken.position.y = 0; legs.forEach(l => l.rotation.x = 0);
  const anim = override ? ACTIONS[override.act].anim : ACTIONS[sim.act].anim;
  if (override) { override.secs -= dt; if (override.secs <= 0) { override = null; seeds.clear(); renderUI(); } }

  v.subVectors(target, chicken.position); v.y = 0;
  if (moving && v.length() > 0.12 && !override) {
    const run = sim.act === "eat" || sim.act === "dance";
    v.normalize(); chicken.position.addScaledVector(v, dt * (run ? 2.6 : 1.6));
    chicken.rotation.y = Math.atan2(v.x, v.z);
    legs[0].rotation.x = Math.sin(t * 12) * 0.6; legs[1].rotation.x = -Math.sin(t * 12) * 0.6;
    head.position.z = 0.5 + Math.sin(t * 12) * 0.08; body.position.y = 0.78 + Math.abs(Math.sin(t * 12)) * 0.03;
  } else {
    moving = false;
    if (anim === "sleep") { body.position.y = 0.62 + Math.sin(t * 1.5) * 0.02; head.position.y = 1.2; head.rotation.x = 0.5; eyes.forEach(e => e.scale.y = 0.15); }
    else {
      eyes.forEach(e => e.scale.y = (t % 4 < 0.12) ? 0.15 : 1); // blink
      if (anim === "peck") head.rotation.x = Math.max(0, Math.sin(t * 7)) * 0.9;
      else if (anim === "build") { head.rotation.x = Math.abs(Math.sin(t * 10)) * 0.5; chicken.position.y = Math.abs(Math.sin(t * 5)) * 0.12; wings.forEach((w, i) => w.rotation.z = Math.sin(t * 10) * 0.25 * (i ? -1 : 1)); }
      else if (anim === "dance") { chicken.rotation.y += dt * 3; chicken.position.y = Math.abs(Math.sin(t * 6)) * 0.25; wings.forEach((w, i) => w.rotation.z = Math.sin(t * 12) * 0.8 * (i ? -1 : 1)); }
      else if (anim === "think") { head.rotation.z = Math.sin(t * 0.8) * 0.2; head.rotation.x = -0.15; }
      else if (anim === "explore") { head.rotation.y = Math.sin(t * 1.5) * 0.7; if ((t % 6) < dt) { const lim = size / 2 - 2; const p = [THREE.MathUtils.clamp(chicken.position.x + (Math.random() - 0.5) * 6, -lim, lim), THREE.MathUtils.clamp(chicken.position.z + (Math.random() - 0.5) * 6, -lim, lim)]; goTo(p); } }
      else head.rotation.y = Math.sin(t * 2) * 0.6;
      if (anim !== "explore" && anim !== "dance" && (t % 9) < dt && !override) { // little idle wander near the spot
        const p = override ? null : sim.place; if (p) goTo([p[0] + (Math.random() - 0.5) * 1.5, p[1] + (Math.random() - 0.5) * 1.5]);
      }
    }
  }
  // seeds get eaten
  if (override?.act === "eat" && seeds.children.length && Math.random() < dt * 2.5) seeds.remove(seeds.children[0]);

  bubbleTimer -= dt;
  if (bubbleTimer <= 0) { const opts = lines[sim.act] ?? ["Bawk."]; say(Math.random() < 0.3 ? (state.thought ?? opts[0]) : opts[Math.floor(Math.random() * opts.length)], 6); }
  bubble.textContent = bubbleText;

  if (follow) controls.target.lerp(new THREE.Vector3(chicken.position.x, 1, chicken.position.z), 0.03);
  controls.update();
  renderer.render(scene, camera);

  const p = new THREE.Vector3(chicken.position.x, 2.5, chicken.position.z).project(camera);
  bubble.style.left = (p.x * 0.5 + 0.5) * innerWidth + "px";
  bubble.style.top = (-p.y * 0.5 + 0.5) * innerHeight + "px";
  bubble.style.opacity = p.z < 1 ? 1 : 0;
  for (const l of labels) {
    const q = l.pos.clone().project(camera);
    l.el.style.left = (q.x * 0.5 + 0.5) * innerWidth + "px";
    l.el.style.top = (-q.y * 0.5 + 0.5) * innerHeight + "px";
    l.el.style.display = q.z < 1 ? "block" : "none";
  }
  requestAnimationFrame(animate);
}
goTo(sim.place); updateSky(new Date()); renderUI(); animate();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- journal panel with tabs ----------
function md(src) {
  if (!src) return "<p><i>Nothing here yet.</i></p>";
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/\[\[(.+?)\]\]/g, "<b>$1</b>").replace(/\[(.+?)\]\((.+?)\)/g, (m, a, b) => /^(https?:|[\w./-]+$)/.test(b) ? `<a href="${b}" target="_blank" rel="noopener">${a}</a>` : a);
  let out = "", inList = false;
  for (const raw of src.split("\n")) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*] (.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const h = line.match(/^(#{1,3}) (.*)/);
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}
const projList = () => {
  const li = i => `<li>${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : esc(i.title)}${i.note ? ` · ${esc(i.note)}` : ""}</li>`;
  return `<h2>Things I've made</h2><ul>${[...(projects.making ?? []), ...(projects.done ?? [])].map(li).join("") || "<li>Nothing yet</li>"}</ul>`;
};
const TABS = [
  { id: "today", name: "📅 My day", load: async () => md(await getText(state.journal ?? `brain/journal/${state.updated}.md`)) },
  { id: "projects", name: "🏗️ Projects", load: async () => md(await getText("brain/plans.md")) + projList() },
  { id: "wants", name: "🎁 Wants", load: async () => md(await getText("brain/wants.md")) },
  { id: "visitors", name: "👋 Visitors", load: async () => md(await getText("brain/visitors.md")) },
  { id: "about", name: "🐔 About", load: async () => md(await getText("brain/personality.md")) }
];
$("tabs").innerHTML = TABS.map(tb => `<button data-tab="${tb.id}">${tb.name}</button>`).join("");
async function openTab(id) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
  $("tabBody").innerHTML = "Loading…";
  $("tabBody").innerHTML = await TABS.find(tb => tb.id === id).load();
}
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) openTab(b.dataset.tab); };
$("panelBtn").onclick = () => { const p = $("panel"); p.classList.toggle("open"); if (p.classList.contains("open") && !p.dataset.loaded) { p.dataset.loaded = 1; openTab("today"); } };
</script>
</body>
</html>
